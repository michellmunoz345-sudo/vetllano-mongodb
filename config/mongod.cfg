# mongod.cfg - Configuracion de MongoDB para el proyecto VetLlano (Windows)
# Copiar a C:\data\mongod.cfg y apuntar el servicio a este archivo
# (ver GUIA_SEGURIDAD.md, paso 5).
# Documentacion: https://www.mongodb.com/docs/manual/reference/configuration-options/

# Donde se guardan los datos (la misma ruta que ya usa el servicio actual)
storage:
  dbPath: C:\data\db

# Registro del servidor
systemLog:
  destination: file
  logAppend: true
  path: C:\data\db\mongod.log

# Red: solo acepta conexiones desde esta misma maquina
net:
  port: 27017
  bindIp: 127.0.0.1

# Seguridad: obliga a autenticarse para cualquier operacion
security:
  authorization: enabled
